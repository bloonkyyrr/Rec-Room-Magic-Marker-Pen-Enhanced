name: Release

# Publishing happens in two ways:
#   * pushing a version tag  -> the release is created and becomes "latest"
#   * publishing a release   -> the built zip is attached to that release
# Releases created here use GITHUB_TOKEN, and GitHub does not start new workflow
# runs for token-created events, so the two paths cannot loop.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (for example v1.0.0)
        required: true

permissions:
  contents: write

env:
  DOTNET_VERSION: 9.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  TAG_NAME: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'nuget.config', 'RecRoomPainter.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore RecRoomPainter.sln

      - name: Publish
        run: >
          dotnet publish RecRoomPainter/RecRoomPainter.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Package
        run: Compress-Archive -Path 'publish/*' -DestinationPath "RecRoomPainter-${{ env.TAG_NAME }}-win-x64.zip" -Force

      - name: Attach build to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: RecRoomPainter-${{ env.TAG_NAME }}-win-x64.zip
          # Keep notes that were written by hand; only generate them when this
          # workflow is the one creating the release from a tag.
          generate_release_notes: ${{ github.event_name != 'release' }}
          make_latest: true
          fail_on_unmatched_files: true

      # Also keep the zip as a workflow artifact, so a release run can be
      # inspected without downloading it from the releases page.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecRoomPainter-${{ env.TAG_NAME }}-win-x64
          path: RecRoomPainter-${{ env.TAG_NAME }}-win-x64.zip
          if-no-files-found: error
          retention-days: 30
