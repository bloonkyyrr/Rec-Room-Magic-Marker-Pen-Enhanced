name: Build

# Builds every push to the default branch and every pull request, so a broken
# commit is caught before it reaches a release.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 9.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The runtime packs for the self-contained publish are large, so reuse them
      # between runs instead of downloading them on every build.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'nuget.config', 'RecRoomPainter.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore RecRoomPainter.sln

      - name: Build
        run: dotnet build RecRoomPainter.sln -c Release --no-restore

      # Self-contained single file: the result runs on a machine without .NET
      # installed, which is what a release download needs to be.
      - name: Publish
        run: >
          dotnet publish RecRoomPainter/RecRoomPainter.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Package
        run: Compress-Archive -Path 'publish/*' -DestinationPath 'RecRoomPainter-win-x64.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RecRoomPainter-win-x64
          path: RecRoomPainter-win-x64.zip
          if-no-files-found: error
          retention-days: 30
